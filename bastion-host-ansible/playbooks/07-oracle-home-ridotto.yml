---
- name: Setup utente oracle e installazione base CMAN 19.3.0
  hosts: all
  become: true
  gather_facts: true

  vars:
    oracle_user: oracle
    oracle_group: oinstall
    oracle_base: /base
    oracle_cman_home: "{{ oracle_base }}/app/oracle/product/cman1930"
    oracle_zip_path: /tmp/LINUX.X64_193000_client.zip

  tasks:

    - name: Crea gruppo {{ oracle_group }}
      ansible.builtin.group:
        name: "{{ oracle_group }}"
        state: present

    - name: Crea utente {{ oracle_user }}
      ansible.builtin.user:
        name: "{{ oracle_user }}"
        group: "{{ oracle_group }}"
        shell: /bin/bash
        create_home: true
        state: present
      register: oracle_user_res

    - name: Ricava home directory utente oracle
      ansible.builtin.set_fact:
        oracle_home: "{{ oracle_user_res.home | default('/home/' ~ oracle_user) }}"

    - name: Crea struttura directory Oracle Home
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: "{{ oracle_user }}"
        group: "{{ oracle_group }}"
        mode: '0755'
      loop:
        - "{{ oracle_base }}"
        - "{{ oracle_cman_home }}"
        - "{{ oracle_home }}/stage"

    - name: Decomprimi client Oracle nella stage
      ansible.builtin.unarchive:
        src: "{{ oracle_zip_path }}"
        dest: "{{ oracle_home }}/stage"
        remote_src: yes
        owner: "{{ oracle_user }}"
        group: "{{ oracle_group }}"

    - name: Aggiorna il database di locate con updatedb
      ansible.builtin.command: updatedb
      become: true
